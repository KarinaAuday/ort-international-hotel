  <!-- sea -->
  <rect x="0" y="270" width="1200" height="90" fill="url(#sea)"/>
  <path d="M0 275 Q 50 268 100 275 T 200 275 T 300 275 T 400 275 T 500 275 T 600 275 T 700 275 T 800 275 T 900 275 T 1000 275 T 1100 275 T 1200 275 V360 H0 Z" fill="#4d8ecf" opacity="0.5"/>

