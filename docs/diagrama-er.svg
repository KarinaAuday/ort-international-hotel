<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="700" fill="#ffffff"/>

  <!-- ===================== HOTEL ===================== -->
  <g>
    <rect x="30" y="30" width="230" height="182" rx="6" fill="#eaf2ff" stroke="#2b5fad" stroke-width="1.5"/>
    <rect x="30" y="30" width="230" height="30" rx="6" fill="#2b5fad"/>
    <text x="145" y="50" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">HOTEL</text>
    <line x1="30" y1="60" x2="260" y2="60" stroke="#2b5fad" stroke-width="1"/>

    <text x="42" y="80"  font-size="13" font-weight="700" text-decoration="underline">Id</text>
    <text x="150" y="80" font-size="11" fill="#555">PK</text>

    <text x="42" y="100" font-size="13">Nombre</text>
    <text x="42" y="120" font-size="13">Pais</text>
    <text x="42" y="140" font-size="13">Ciudad</text>
    <text x="42" y="160" font-size="13">Direccion</text>
    <text x="42" y="180" font-size="13">CantidadEstrellas</text>
  </g>

  <!-- ===================== PASAJERO ===================== -->
  <g>
    <rect x="720" y="30" width="230" height="182" rx="6" fill="#eaf7ee" stroke="#2f8f4e" stroke-width="1.5"/>
    <rect x="720" y="30" width="230" height="30" rx="6" fill="#2f8f4e"/>
    <text x="835" y="50" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PASAJERO</text>
    <line x1="720" y1="60" x2="950" y2="60" stroke="#2f8f4e" stroke-width="1"/>

    <text x="732" y="80"  font-size="13" font-weight="700" text-decoration="underline">Id</text>
    <text x="840" y="80" font-size="11" fill="#555">PK</text>

    <text x="732" y="100" font-size="13">Nombre</text>
    <text x="732" y="120" font-size="13">Apellido</text>
    <text x="732" y="140" font-size="13">Documento</text>
    <text x="732" y="160" font-size="13">Email</text>
    <text x="732" y="180" font-size="13">Telefono</text>
    <text x="732" y="200" font-size="13">PaisOrigen</text>
  </g>

  <!-- ===================== HABITACION ===================== -->
  <g>
    <rect x="30" y="480" width="230" height="182" rx="6" fill="#fff3e6" stroke="#c97a1e" stroke-width="1.5"/>
    <rect x="30" y="480" width="230" height="30" rx="6" fill="#c97a1e"/>
    <text x="145" y="500" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">HABITACION</text>
    <line x1="30" y1="510" x2="260" y2="510" stroke="#c97a1e" stroke-width="1"/>

    <text x="42" y="530" font-size="13" font-weight="700" text-decoration="underline">Id</text>
    <text x="150" y="530" font-size="11" fill="#555">PK</text>

    <text x="42" y="550" font-size="13">Numero</text>
    <text x="42" y="570" font-size="13">Tipo</text>
    <text x="42" y="590" font-size="13">Capacidad</text>
    <text x="42" y="610" font-size="13">PrecioPorNoche</text>

    <text x="42" y="630" font-size="13" font-style="italic">HotelId</text>
    <text x="150" y="630" font-size="11" fill="#555">FK &#8594; Hotel</text>
  </g>

  <!-- ===================== RESERVA (entidad central) ===================== -->
  <g>
    <rect x="365" y="255" width="250" height="230" rx="6" fill="#fdeaea" stroke="#b13030" stroke-width="1.5"/>
    <rect x="365" y="255" width="250" height="30" rx="6" fill="#b13030"/>
    <text x="490" y="275" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">RESERVA</text>
    <line x1="365" y1="285" x2="615" y2="285" stroke="#b13030" stroke-width="1"/>

    <text x="377" y="305" font-size="13" font-weight="700" text-decoration="underline">Id</text>
    <text x="480" y="305" font-size="11" fill="#555">PK</text>

    <text x="377" y="325" font-size="13">FechaDesde</text>
    <text x="377" y="345" font-size="13">FechaHasta</text>
    <text x="377" y="365" font-size="13">Estado</text>
    <text x="377" y="385" font-size="13">MontoTotal</text>

    <text x="377" y="405" font-size="13" font-style="italic">PasajeroId</text>
    <text x="500" y="405" font-size="11" fill="#555">FK</text>

    <text x="377" y="425" font-size="13" font-style="italic">HotelId</text>
    <text x="500" y="425" font-size="11" fill="#555">FK</text>

    <text x="377" y="445" font-size="13" font-style="italic">HabitacionId</text>
    <text x="500" y="445" font-size="11" fill="#555">FK</text>
  </g>

  <!-- ===================== RELACIONES ===================== -->
  <!-- Hotel -> Reserva -->
  <line x1="260" y1="120" x2="365" y2="300" stroke="#333" stroke-width="1.4"/>
  <text x="270" y="200" font-size="12" fill="#333">1</text>
  <text x="345" y="290" font-size="12" fill="#333">N</text>

  <!-- Pasajero -> Reserva -->
  <line x1="720" y1="120" x2="615" y2="300" stroke="#333" stroke-width="1.4"/>
  <text x="700" y="200" font-size="12" fill="#333">1</text>
  <text x="625" y="290" font-size="12" fill="#333">N</text>

  <!-- Habitacion -> Reserva -->
  <line x1="260" y1="570" x2="365" y2="440" stroke="#333" stroke-width="1.4"/>
  <text x="270" y="500" font-size="12" fill="#333">1</text>
  <text x="345" y="450" font-size="12" fill="#333">N</text>

  <!-- Hotel -> Habitacion -->
  <line x1="145" y1="212" x2="145" y2="480" stroke="#333" stroke-width="1.4"/>
  <text x="152" y="260" font-size="12" fill="#333">1</text>
  <text x="152" y="470" font-size="12" fill="#333">N</text>

  <!-- Leyenda -->
  <g>
    <rect x="365" y="600" width="250" height="80" rx="4" fill="#f7f7f7" stroke="#ccc"/>
    <text x="378" y="618" font-size="12" font-weight="700">Referencias</text>
    <text x="378" y="636" font-size="11" text-decoration="underline">PK</text>
    <text x="400" y="636" font-size="11" fill="#333">= Primary Key (clave primaria)</text>
    <text x="378" y="654" font-size="11" font-style="italic">FK</text>
    <text x="400" y="654" font-size="11" fill="#333">= Foreign Key (clave foranea)</text>
    <text x="378" y="672" font-size="11" fill="#333">1 : N = un Hotel/Pasajero/Habitacion tiene N Reservas</text>
  </g>
</svg>
